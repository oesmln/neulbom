spring:
  config:
    # Local secrets stay in backend/.env (gitignored) while Spring still
    # resolves the same ${ENV_VAR} placeholders used in every environment.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neulbom}
    username: ${DB_USERNAME:kimminseo}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${DB_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

app:
  ai-server:
    # 로컬 AI 서버 연동에서만 host.docker.internal/localhost HTTP 주소를 허용한다.
    allow-insecure-local-audio-url: ${AI_AUDIO_ALLOW_INSECURE_LOCAL_AUDIO_URL:true}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:WARN}
