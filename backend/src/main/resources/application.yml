spring:
  application:
    name: neulbom-backend
  profiles:
    default: local
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:30MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

app:
  request-id:
    header-name: ${REQUEST_ID_HEADER:X-Request-Id}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-Id,Idempotency-Key}
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:./uploads}
    bucket: ${FILE_STORAGE_BUCKET:neulbom-local}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:25MB}
    allowed-mime-types: ${APP_ALLOWED_MIME_TYPES:audio/wav,audio/x-wav,audio/mpeg,audio/mp4}
    allowed-extensions: ${APP_ALLOWED_FILE_EXTENSIONS:wav,mp3,m4a}
  external-api:
    connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_API_READ_TIMEOUT:30s}
    retry-count: ${EXTERNAL_API_RETRY_COUNT:2}
  security:
    jwt:
      secret: ${JWT_SECRET:local-only-change-this-jwt-secret-key-please}
      issuer: ${JWT_ISSUER:neulbom}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
      user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}

logging:
  level:
    root: INFO
    com.neulbom.backend: INFO
