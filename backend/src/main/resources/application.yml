spring:
  application:
    name: neulbom-backend
  profiles:
    default: local
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:30MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

app:
  request-id:
    header-name: ${REQUEST_ID_HEADER:X-Request-Id}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-Id,Idempotency-Key}
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:./uploads}
    bucket: ${FILE_STORAGE_BUCKET:neulbom-local}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:25MB}
    allowed-mime-types: ${APP_ALLOWED_MIME_TYPES:audio/wav,audio/x-wav,audio/mpeg,audio/mp4,audio/webm}
    allowed-extensions: ${APP_ALLOWED_FILE_EXTENSIONS:wav,mp3,m4a,webm}
  external-api:
    connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_API_READ_TIMEOUT:30s}
    retry-count: ${EXTERNAL_API_RETRY_COUNT:2}
    allow-fallback: ${EXTERNAL_API_ALLOW_FALLBACK:true}
    stt-provider: ${STT_PROVIDER:auto}
    whisper-api-key: ${WHISPER_API_KEY:}
    whisper-base-url: ${WHISPER_API_BASE_URL:https://api.openai.com}
    whisper-model: ${WHISPER_MODEL:whisper-1}
    local-whisper-base-url: ${LOCAL_WHISPER_API_BASE_URL:}
    local-whisper-api-key: ${LOCAL_WHISPER_API_KEY:}
    local-whisper-model: ${LOCAL_WHISPER_MODEL:whisper-1}
    google-stt-base-url: ${GOOGLE_STT_BASE_URL:}
    google-stt-project-id: ${GOOGLE_STT_PROJECT_ID:}
    google-stt-location: ${GOOGLE_STT_LOCATION:asia-northeast1}
    google-stt-model: ${GOOGLE_STT_MODEL:chirp_3}
    google-stt-language-code: ${GOOGLE_STT_LANGUAGE_CODE:ko-KR}
    ast-api-url: ${AST_API_URL:}
    ast-api-key: ${AST_API_KEY:}
    ast-model: ${AST_MODEL:v1}
    kc-electra-api-url: ${KCELECTRA_API_URL:}
    kc-electra-api-key: ${KCELECTRA_API_KEY:}
    kc-electra-model: ${KCELECTRA_MODEL:v1}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
  security:
    jwt:
      secret: ${JWT_SECRET:local-only-change-this-jwt-secret-key-please}
      issuer: ${JWT_ISSUER:neulbom}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    password-reset-rate-limit:
      email-max-attempts: ${PASSWORD_RESET_EMAIL_RATE_LIMIT_MAX_ATTEMPTS:3}
      email-window: ${PASSWORD_RESET_EMAIL_RATE_LIMIT_WINDOW:15m}
      ip-max-attempts: ${PASSWORD_RESET_IP_RATE_LIMIT_MAX_ATTEMPTS:10}
      ip-window: ${PASSWORD_RESET_IP_RATE_LIMIT_WINDOW:1h}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
      user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}
      allowed-redirect-uris: ${NAVER_ALLOWED_REDIRECT_URIS:}

logging:
  level:
    root: INFO
    com.neulbom.backend: INFO
