spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/neulbom_test}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

  security:
    user:
      name: test
      password: test

app:
  storage:
    local-root: build/test-uploads
  security:
    email-verification-required: false
    jwt:
      secret: test-only-jwt-secret-key-that-is-long-enough
      issuer: neulbom-test
      access-token-ttl: 1h
      refresh-token-ttl: 30d
    password-reset-rate-limit:
      email-max-attempts: 2
      email-window: 1m
      ip-max-attempts: 3
      ip-window: 1m
  oauth:
    kakao:
      client-id: test-kakao-client
      client-secret: test-kakao-secret
      token-uri: http://localhost:9999/kakao/token
      user-info-uri: http://localhost:9999/kakao/user
      allowed-redirect-uris: http://localhost/callback
    naver:
      client-id: test-naver-client
      client-secret: test-naver-secret
      token-uri: http://localhost:9999/naver/token
      user-info-uri: http://localhost:9999/naver/user
      allowed-redirect-uris: http://localhost/callback

logging:
  level:
    root: WARN
