spring:
  datasource:
    url: jdbc:h2:mem:neulbom-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

  security:
    user:
      name: test
      password: test

logging:
  level:
    root: WARN
