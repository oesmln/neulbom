[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neulbom-ai-server"
version = "0.1.0"
description = "늘봄 음성·텍스트 기반 위험도 분석 서버"
requires-python = ">=3.11,<3.14"
dependencies = [
    "av>=14.0.0,<17.0.0",
    "fastapi>=0.136.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "joblib>=1.4.2,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "scikit-learn==1.6.1",
    "silero-vad[onnx-cpu]==6.2.1",
    "torch==2.13.0",
    "transformers==5.15.1",
    "uvicorn[standard]>=0.52.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0,<10.0.0",
    "PyYAML>=6.0.3,<7.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
