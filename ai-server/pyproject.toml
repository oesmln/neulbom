[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neulbom-ai-server"
version = "0.1.0"
description = "늘봄 음성·텍스트 기반 위험도 분석 서버"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.136.0,<1.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "uvicorn[standard]>=0.52.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12.0,<3.0.0",
    "pytest>=9.1.0,<10.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
